<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SGAuth logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171a"/><stop offset="0.55" stop-color="#0a0a0b"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#6b6b73" stop-opacity="0.6"/>
      <stop offset="0.65" stop-color="#2a2a30" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d9d9e0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a50d25"/><stop offset="0.5" stop-color="#c8102e"/><stop offset="1" stop-color="#e0213f"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="redglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.78  0 0 0 0 0.06  0 0 0 0 0.18  0 0 0 0.7 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)"><rect width="512" height="512" fill="url(#sheen)"/></g>
  <rect x="19" y="19" width="474" height="474" rx="109" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- red shield outline -->
  <g filter="url(#redglow)" transform="translate(0 -10)">
    <path d="M256 104 L378 150 V268 C378 342 326 392 256 422 C186 392 134 342 134 268 V150 Z"
          fill="none" stroke="url(#red)" stroke-width="20" stroke-linejoin="round"/>
  </g>
</svg>
