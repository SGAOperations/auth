name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache prisma engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx prisma generate
        env:
          DIRECT_URL: "postgresql://placeholder"
      - run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/neon-branch-hygiene.test.mjs

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache prisma engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Apply migrations to a scratch database
        run: npx prisma migrate deploy
      - name: Check schema.prisma matches prisma/migrations
        run: |
          set +e
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --script \
            --exit-code > "$RUNNER_TEMP/drift.sql"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo '::error file=prisma/schema.prisma::prisma/schema.prisma and prisma/migrations/ are out of sync. Run "npx prisma migrate dev --name <change>" locally and commit the new prisma/migrations/ directory.'
            echo "Missing migration SQL:"
            cat "$RUNNER_TEMP/drift.sql"
            exit 1
          fi
          exit "$code"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: neon-test-branch
      cancel-in-progress: false
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
      SGAUTH_ENV: local
      BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
    steps:
      - name: Check Neon credentials
        run: |
          missing=0
          for name in NEON_API_KEY NEON_PROJECT_ID DATABASE_URL DIRECT_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. The test job needs the Neon secrets described in CONTRIBUTING.md (fork PRs do not receive them)."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache prisma engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx prisma generate
      - name: Reset Neon test branch
        run: npx --yes neonctl@2 branches reset test --parent --project-id "$NEON_PROJECT_ID"
      - run: npm test
