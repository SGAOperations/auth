# Scheduled jobs: calls the bearer-protected /api/jobs/* routes on a schedule.
#
# Not a Vercel cron: Hobby allows two jobs at once a day and rejects finer
# schedules at deploy time, so vercel.json carries no `crons`.
#
# pa-transfer runs hourly, not every 15 minutes: each run queries Postgres and
# wakes the Neon compute for about 5 minutes, which at 15 minutes costs about
# 60 CU-hours a month per branch against the Free plan's 100 per project.
# A transfer therefore completes up to about an hour after its cooling window.
#
# Scheduled runs target production only. The dev environment is dispatch-only
# (Run workflow, environment=dev). Actions schedules can start several minutes
# late, and a missed run is caught by the next. Every job is idempotent, so the
# curl retry is safe. Scheduled runs happen only from the default branch, and
# GitHub disables them after 60 days without repository activity.
name: Scheduled jobs

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "*/15 * * * *"
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        required: true
        options:
          - pa-transfer
          - alerts
          - retention
      environment:
        description: Deployment to call
        type: choice
        required: true
        default: dev
        options:
          - production
          - dev

permissions:
  contents: read

concurrency:
  group: scheduled-jobs-${{ inputs.job || github.event.schedule }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve job and target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              "7 * * * *") job=pa-transfer ;;
              "*/15 * * * *") job=alerts ;;
              "23 8 * * *") job=retention ;;
              *) echo "::error::Unknown schedule: $SCHEDULE"; exit 1 ;;
            esac
            environment=production
          else
            job="$INPUT_JOB"
            environment="$INPUT_ENVIRONMENT"
          fi

          case "$environment" in
            production) base=https://auth.northeasternsga.com ;;
            dev) base=https://auth-dev.northeasternsga.com ;;
            *) echo "::error::Unknown environment: $environment"; exit 1 ;;
          esac

          {
            echo "job=$job"
            echo "environment=$environment"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

      - name: Call the job
        env:
          JOB: ${{ steps.target.outputs.job }}
          BASE: ${{ steps.target.outputs.base }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          SECRET_PRODUCTION: ${{ secrets.CRON_SECRET_PRODUCTION }}
          SECRET_DEV: ${{ secrets.CRON_SECRET_DEV }}
          BYPASS_DEV: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET_DEV }}
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            secret="$SECRET_PRODUCTION"
          else
            secret="$SECRET_DEV"
          fi
          if [ -z "$secret" ]; then
            echo "::error::No CRON_SECRET is configured for $ENVIRONMENT"
            exit 1
          fi

          args=(
            --fail-with-body --silent --show-error
            --max-time 60 --retry 2 --retry-all-errors
            -X POST
            -H "Authorization: Bearer $secret"
          )
          # auth-dev sits behind Vercel Standard Protection until it is lifted.
          if [ "$ENVIRONMENT" = "dev" ] && [ -n "$BYPASS_DEV" ]; then
            args+=(-H "x-vercel-protection-bypass: $BYPASS_DEV")
          fi

          curl "${args[@]}" "$BASE/api/jobs/$JOB"
          echo
